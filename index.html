
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéVault - Immersive Collection</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c18;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#121a2e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:27px;font-weight:900;color:#ffdb71}
.coins{background:#28334b;padding:12px 17px;border-radius:12px;color:#ffdb71;font-weight:bold}
nav{padding:14px 5%;display:flex;gap:9px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#283650;color:white;font-weight:bold}
button:hover{filter:brightness(1.2)}
.active{background:#f4c65a;color:#171b28}
main{padding:15px 5% 45px}
.page{display:none}.page.active{display:block}
.hero{text-align:center;padding:25px 0}
.hero h1{font-size:40px;margin:10px}
.gold{color:#ffdb71}
.pack{max-width:310px;margin:20px auto;background:linear-gradient(145deg,#2d4c89,#17172e,#703a87);border:2px solid #d9b75b;border-radius:22px;text-align:center;padding:24px}
.pack-icon{font-size:95px}
.primary{background:linear-gradient(90deg,#e8b33e,#ffe18b);color:#151827}
.small{font-size:12px;color:#aab6d0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px;margin-top:20px}
.card{background:linear-gradient(145deg,#263653,#111827);border:2px solid #65738d;border-radius:16px;padding:11px;overflow:hidden;position:relative}
.card img{width:100%;height:165px;object-fit:contain;background:radial-gradient(circle,#ffffff25,transparent 70%)}
.cardname{font-size:19px;font-weight:900;margin:7px 0}
.hp{float:right;color:#ff8e8e;font-weight:bold}
.attack{background:#101727;border-radius:8px;padding:9px;margin-top:8px;font-size:12px}
.attack b:last-child{float:right;color:#ffdb71}
.Common{border-color:#65738d}.Uncommon{border-color:#53bd8c}
.Rare{border-color:#65aaff}.Ultra{border-color:#b58aff;box-shadow:0 0 14px #a66cff55}
.Legendary{border-color:#ffd15a;box-shadow:0 0 17px #ffcb4c77}
.Shiny{border-color:#ff72db;box-shadow:0 0 19px #ff72db88}
.Star1{border:2px solid #6de2ff;box-shadow:0 0 18px #48d9ff88}
.Star2{border:2px solid #c58aff;box-shadow:0 0 22px #b45dff99}
.Star3{border:2px solid #ffe58b;box-shadow:0 0 27px #ffe58baa;background:linear-gradient(145deg,#684b20,#2c2150,#174b68)}
.rarity{font-size:11px;font-weight:900;letter-spacing:1px;color:#ffdf85}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
input,select{padding:12px;border-radius:9px;border:1px solid #43516d;background:#172239;color:white}
.pageTitle{margin-top:25px}
#opening{display:none;text-align:center;margin:25px 0}
.reveal{max-width:370px;margin:20px auto;animation:reveal .6s ease}
@keyframes reveal{from{opacity:0;transform:scale(.65) rotateY(40deg)}to{opacity:1;transform:scale(1) rotateY(0)}}
.reveal .card img{height:230px}
.storybtn{width:100%;margin-top:10px;background:#57417e}
.modal{display:none;position:fixed;inset:0;background:#050817f5;z-index:10;overflow:auto;padding:22px;align-items:center;justify-content:center}
.modal.show{display:flex}
.storybox{width:min(680px,100%);background:#151d32;border:2px solid #ffe18b;border-radius:20px;overflow:hidden;box-shadow:0 0 50px #e3bb5d44}
.storybox img{width:100%;height:310px;object-fit:cover}
.storytext{padding:22px}
.storytext h1{color:#ffdb71}
.storytext p{line-height:1.65;color:#d2d8e8}
.dexrow{padding:13px;margin:8px 0;background:#18243a;border-radius:9px}
.empty{text-align:center;color:#aab6d0;padding:35px}
</style>
</head>
<body>
<header>
 <div class="logo">⚡ PokéVault</div>
 <div class="coins">🪙 <span id="coins">200,000,000,000</span></div>
</header>
<nav>
 <button class="active" onclick="showPage('home',this)">🏠 Home</button>
 <button onclick="showPage('collection',this)">🎴 Collection</button>
 <button onclick="showPage('dex',this)">📖 Pokédex</button>
</nav>
<main>
<section id="home" class="page active">
 <div class="hero">
  <h1>Welcome to <span class="gold">PokéVault</span></h1>
  <p>Discover Pokémon. Find incredible cards. Unlock their stories.</p>
  <p class="gold">✨ Your adventure starts here.</p>
 </div>
 <div class="pack">
  <div class="pack-icon">🎴</div>
  <h2>IMMERSIVE BOOSTER</h2>
  <p>10 cards • Special story cards possible</p>
  <p class="gold">100,000 coins</p>
  <button class="primary" onclick="openPack()">OPEN BOOSTER PACK</button>
 </div>
 <div id="opening">
  <h2 id="openingTitle">Your pack is ready!</h2>
  <p id="openingCount"></p>
  <div class="reveal" id="revealCard"></div>
  <button class="primary" id="nextBtn" onclick="revealNext()">REVEAL NEXT CARD</button>
  <button onclick="revealAll()">REVEAL ALL</button>
  <div id="packResults" class="cards"></div>
 </div>
</section>

<section id="collection" class="page">
 <h1 class="pageTitle">🎴 My Collection</h1>
 <p id="stats" class="small"></p>
 <div class="filters">
  <input id="search" placeholder="Search Pokémon..." oninput="renderCollection()">
  <select id="filter" onchange="renderCollection()">
   <option value="All">All rarities</option>
   <option value="Star3">3-Star Immersive</option>
   <option value="Star2">2-Star Special</option>
   <option value="Star1">1-Star Illustration</option>
   <option value="Shiny">Shiny</option>
   <option value="Legendary">Legendary</option>
   <option value="Ultra">Ultra Rare</option>
   <option value="Rare">Rare</option>
   <option value="Uncommon">Uncommon</option>
   <option value="Common">Common</option>
  </select>
  <select id="sort" onchange="renderCollection()">
   <option value="rarity">Best rarity first</option>
   <option value="name">Name A-Z</option>
   <option value="hp">Highest HP</option>
  </select>
 </div>
 <div id="collectionCards" class="cards"></div>
</section>

<section id="dex" class="page">
 <h1 class="pageTitle">📖 Pokédex</h1>
 <input id="dexSearch" placeholder="Search discovered Pokémon..." oninput="renderDex()">
 <div id="dexList"></div>
</section>
</main>

<div class="modal" id="storyModal" onclick="if(event.target===this)closeStory()">
 <div class="storybox">
  <img id="storyImage" src="" alt="Story artwork">
  <div class="storytext">
   <div class="rarity" id="storyRarity"></div>
   <h1 id="storyTitle"></h1>
   <p id="storyDescription"></p>
   <p class="small" id="storyCard"></p>
   <button class="primary" onclick="closeStory()">CLOSE STORY</button>
  </div>
 </div>
</div>

<script>
const START=200000000000;
const COST=100000;
const COINKEY="pc_coins";
const CARDKEY="pc_collection";
const VERSIONKEY="pc_story_upgrade_v1";

let coins=Number(localStorage.getItem(COINKEY));
let collection=JSON.parse(localStorage.getItem(CARDKEY)||"[]");
let packCards=[],revealIndex=0,busy=false;

if(localStorage.getItem(VERSIONKEY)!=="yes"){
 coins=START;
 localStorage.setItem(VERSIONKEY,"yes");
}
if(!Number.isFinite(coins)||coins<0)coins=START;

const stories={
 fire:[
 ["The Guardian of the Burning Sky","Above the ancient volcano, this Pokémon watches over a hidden kingdom. As the first light touches the mountains, its flames awaken and illuminate the clouds."],
 ["A Flame That Never Sleeps","Deep inside the mountain, a tiny flame shines in the darkness. This Pokémon has guarded it for generations, protecting a secret older than the kingdom itself."]
 ],
 water:[
 ["The Secret of the Moonlit Ocean","Beneath a silver moon, this Pokémon swims through glowing waves. Sailors tell stories of a mysterious light guiding lost travelers safely home."],
 ["The Keeper of the Deep","In a forgotten underwater city, this Pokémon protects the ancient treasures hidden beneath the coral towers."]
 ],
 electric:[
 ["The City of a Thousand Lights","During a stormy night, this Pokémon runs across the rooftops, restoring power to the sleeping city one spark at a time."],
 ["A Spark of Friendship","After finding a lost friend in the forest, this Pokémon lights the path home with a brilliant electric glow."]
 ],
 grass:[
 ["The Forest That Remembered","In a forest untouched for centuries, this Pokémon watches over the oldest trees and the creatures that live among them."],
 ["The Flower of Dawn","Every morning, the flowers bloom when this Pokémon passes. The forest believes it carries the spirit of spring."]
 ],
 default:[
 ["A Journey Beyond the Horizon","Far beyond the familiar mountains, this Pokémon explores a world filled with mysteries. Every step brings a new discovery."],
 ["The Last Light of the Valley","As the sun sets over the valley, this Pokémon stands on a hilltop, watching over its friends and the home they share."]
 ]
};

const rank=["Star3","Star2","Star1","Shiny","Legendary","Ultra","Rare","Uncommon","Common"];

function save(){
 localStorage.setItem(COINKEY,String(coins));
 localStorage.setItem(CARDKEY,JSON.stringify(collection));
 document.getElementById("coins").textContent=coins.toLocaleString("en-US");
}
function showPage(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 if(id==="collection")renderCollection();
 if(id==="dex")renderDex();
}
function rarityRoll(){
 let n=Math.random()*100;
 if(n<0.12)return "Star3";
 if(n<0.7)return "Star2";
 if(n<2.5)return "Star1";
 if(n<5)return "Shiny";
 if(n<9)return "Legendary";
 if(n<17)return "Ultra";
 if(n<34)return "Rare";
 if(n<57)return "Uncommon";
 return "Common";
}
function getStory(type){
 let group=stories[type]||stories.default;
 return group[Math.floor(Math.random()*group.length)];
}
function randomDamage(){return Math.floor(Math.random()*100)+30}
async function getPokemon(id){
 let r=await fetch("https://pokeapi.co/api/v2/pokemon/"+id);
 if(!r.ok)throw Error("Pokémon loading failed");
 let p=await r.json();
 let type=p.types[0].type.name;
 let artwork=p.sprites.other["official-artwork"].front_default||p.sprites.front_default;
 let hp=Math.max(30,Math.round(p.stats.find(s=>s.stat.name==="hp").base_stat*2.2));
 let moves=p.moves.map(m=>m.move.name.replaceAll("-"," "));
 let special=rarityRoll();
 let story=["Star1","Star2","Star3"].includes(special)?getStory(type):null;
 return {
  id:p.id,name:p.name,image:artwork,type:type,
  types:p.types.map(t=>t.type.name),
  hp:hp,attack1:moves[Math.floor(Math.random()*moves.length)]||"Quick Attack",
  damage1:randomDamage(),attack2:moves[Math.floor(Math.random()*moves.length)]||"Power Blast",
  damage2:randomDamage(),rarity:special,story:story,
  cardId:"PV-"+p.id+"-"+Math.random().toString(36).slice(2,7).toUpperCase()
 };
}
function rarityName(r){
 return {Star3:"★★★ IMMERSIVE RARE",Star2:"★★ SPECIAL ILLUSTRATION",Star1:"★ ILLUSTRATION RARE",Shiny:"SHINY RARE",Legendary:"LEGENDARY",Ultra:"ULTRA RARE",Rare:"RARE",Uncommon:"UNCOMMON",Common:"COMMON"}[r]||r;
}
function cardHTML(c){
 return `<div class="card ${c.rarity}">
 <div><b>#${String(c.id).padStart(3,"0")}</b><span class="hp">♥ ${c.hp} HP</span></div>
 <img src="${c.image}" alt="${c.name}">
 <div class="cardname">${c.name.toUpperCase()}</div>
 <span class="small">${c.types.join(" / ").toUpperCase()}</span>
 <div class="attack"><b>${c.attack1}</b><b>${c.damage1}</b></div>
 <div class="attack"><b>${c.attack2}</b><b>${c.damage2}</b></div>
 <p class="rarity">${rarityName(c.rarity)}</p>
 ${c.story?`<button class="storybtn" onclick="showStory('${c.cardId}')">📖 READ CARD STORY</button>`:""}
 <p class="small">${c.cardId}</p>
 </div>`;
}
async function openPack(){
 if(busy)return;
 if(coins<COST){alert("Not enough coins!");return}
 busy=true;
 coins-=COST;save();
 document.getElementById("opening").style.display="block";
 document.getElementById("revealCard").innerHTML="<h2>✨ Opening your pack...</h2>";
 document.getElementById("packResults").innerHTML="";
 document.getElementById("nextBtn").disabled=true;
 document.getElementById("nextBtn").textContent="LOADING...";
 packCards=[];revealIndex=0;
 try{
  let ids=Array.from({length:10},()=>Math.floor(Math.random()*1025)+1);
  for(let id of ids)packCards.push(await getPokemon(id));
  collection.push(...packCards);save();
  document.getElementById("openingTitle").textContent="Your cards are ready!";
  document.getElementById("nextBtn").disabled=false;
  revealNext();
 }catch(e){
  coins+=COST;save();busy=false;
  document.getElementById("revealCard").innerHTML="<p>Could not load cards. Your coins were returned. Try again.</p>";
  document.getElementById("nextBtn").textContent="TRY AGAIN";
  document.getElementById("nextBtn").disabled=false;
 }
}
function revealNext(){
 if(revealIndex>=packCards.length){finishPack();return}
 let c=packCards[revealIndex++];
 document.getElementById("revealCard").innerHTML=cardHTML(c);
 document.getElementById("openingCount").textContent="Card "+revealIndex+" of 10";
 document.getElementById("nextBtn").textContent=revealIndex===10?"FINISH PACK":"REVEAL NEXT CARD";
}
function revealAll(){
 if(!packCards.length)return;
 revealIndex=10;
 document.getElementById("revealCard").innerHTML="";
 document.getElementById("openingCount").textContent="All 10 cards revealed!";
 document.getElementById("packResults").innerHTML=packCards.map(cardHTML).join("");
 finishPack();
}
function finishPack(){
 document.getElementById("revealCard").innerHTML="";
 document.getElementById("openingCount").textContent="All 10 cards collected!";
 document.getElementById("nextBtn").textContent="PACK OPENED ✓";
 document.getElementById("nextBtn").disabled=true;
 document.getElementById("packResults").innerHTML=packCards.map(cardHTML).join("");
 busy=false;
}
function showStory(cardId){
 let c=collection.find(x=>x.cardId===cardId)||packCards.find(x=>x.cardId===cardId);
 if(!c||!c.story)return;
 document.getElementById("storyImage").src=c.image;
 document.getElementById("storyRarity").textContent=rarityName(c.rarity);
 document.getElementById("storyTitle").textContent=c.story[0];
 document.getElementById("storyDescription").textContent=c.story[1];
 document.getElementById("storyCard").textContent=c.name.toUpperCase()+" • "+c.cardId;
 document.getElementById("storyModal").classList.add("show");
}
function closeStory(){document.getElementById("storyModal").classList.remove("show")}
function renderCollection(){
 let q=document.getElementById("search").value.toLowerCase();
 let f=document.getElementById("filter").value;
 let s=document.getElementById("sort").value;
 let arr=collection.filter(c=>c.name.includes(q)&&(f==="All"||c.rarity===f));
 arr.sort((a,b)=>{
  if(s==="name")return a.name.localeCompare(b.name);
  if(s==="hp")return b.hp-a.hp;
  return rank.indexOf(a.rarity)-rank.indexOf(b.rarity);
 });
 document.getElementById("stats").textContent=collection.length+" cards • "+new Set(collection.map(c=>c.id)).size+" different Pokémon";
 document.getElementById("collectionCards").innerHTML=arr.length?arr.map(cardHTML).join(""):'<div class="empty">No cards found. Open a pack to collect Pokémon!</div>';
}
function renderDex(){
 let q=document.getElementById("dexSearch").value.toLowerCase();
 let unique=[...new Map(collection.map(c=>[c.id,c])).values()].filter(c=>c.name.includes(q)||String(c.id).includes(q));
 document.getElementById("dexList").innerHTML=unique.length?unique.map(c=>`<div class="dexrow">#${String(c.id).padStart(3,"0")} — ${c.name.toUpperCase()} ✓ Discovered</div>`).join(""):'<div class="empty">Your Pokédex is waiting for its first discovery!</div>';
}
save();
</script>
</body>
</html>
